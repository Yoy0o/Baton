# 提交前检查的自动化版本（见 AGENTS.md“完成前检查”）。仓库推送到 GitHub 后生效。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build # 含 tsc 类型检查
      # web/dist 随代码提交（ADR-0008）：重新构建后不应有任何差异
      - name: web/dist 与源码一致
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)" || { echo "web/dist 与 web/src 不一致：请本地 npm run build 后一并提交"; exit 1; }
